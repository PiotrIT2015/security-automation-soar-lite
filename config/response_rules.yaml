
incident_management:
  minimum_severity: MEDIUM
  auto_create_incidents: true
  generate_incident_id: true

alerts:
  enabled: true
  notify_on:
    - MEDIUM
    - HIGH
    - CRITICAL

response:
  enabled: true
  simulation_mode: true
  require_approval: true

  actions:
    LOW:
      - LOG_EVENT

    MEDIUM:
      - CREATE_ALERT
      - COLLECT_EVIDENCE

    HIGH:
      - CREATE_ALERT
      - COLLECT_EVIDENCE
      - REQUEST_IP_BLOCK

    CRITICAL:
      - CREATE_ALERT
      - COLLECT_EVIDENCE
      - REQUEST_IP_BLOCK
      - ESCALATE_TO_ANALYST
