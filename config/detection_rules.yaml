# ==========================================
# SOAR LITE - DETECTION RULES
# ==========================================

detection:

  brute_force:
    enabled: true
    threshold: 5
    score: 30
    description: "Multiple failed login attempts from one IP"

  multiple_accounts:
    enabled: true
    threshold: 3
    score: 15
    description: "Attempts to access multiple user accounts"

  abuseipdb:
    enabled: true
    threshold: 80
    score: 30
    description: "IP has high AbuseIPDB confidence score"

  virustotal:
    enabled: true
    threshold: 1
    score: 25
    description: "IP detected as malicious by VirusTotal"


# ==========================================
# THREAT CLASSIFICATION
# ==========================================

severity:

  critical: 80
  high: 60
  medium: 30
  low: 0
  
# ==========================================
# SOAR LITE - RESPONSE RULES
# ==========================================

incident_management:

  minimum_severity: MEDIUM

  auto_create_incidents: true

  generate_incident_id: true


# ==========================================
# ALERT CONFIGURATION
# ==========================================

alerts:

  enabled: true

  notify_on:

    - MEDIUM
    - HIGH
    - CRITICAL


# ==========================================
# AUTOMATED RESPONSE
# ==========================================

response:

  enabled: true

  simulation_mode: true

  require_approval: true

  actions:

    LOW:
      - LOG_EVENT

    MEDIUM:
      - CREATE_ALERT
      - COLLECT_EVIDENCE

    HIGH:
      - CREATE_ALERT
      - COLLECT_EVIDENCE
      - REQUEST_IP_BLOCK

    CRITICAL:
      - CREATE_ALERT
      - COLLECT_EVIDENCE
      - REQUEST_IP_BLOCK
      - ESCALATE_TO_ANALYST